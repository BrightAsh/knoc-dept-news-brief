name: Daily news collect

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD, today, or yesterday"
        required: false
        default: "yesterday"
  schedule:
    # 00:05 Asia/Seoul every day. GitHub cron uses UTC.
    - cron: "5 15 * * *"

permissions:
  contents: write
  models: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      STAGE1_PROVIDER: ${{ vars.STAGE1_PROVIDER || 'groq' }}
      STAGE1_MODEL: ${{ vars.STAGE1_MODEL || 'llama-3.1-8b-instant' }}
      STAGE1_BATCH_SIZE: ${{ vars.STAGE1_BATCH_SIZE || '8' }}
      STAGE1_MAX_ARTICLES: ${{ vars.STAGE1_MAX_ARTICLES || '0' }}
      STAGE2_PROVIDER: ${{ vars.STAGE2_PROVIDER || 'groq' }}
      STAGE2_MODEL: ${{ vars.STAGE2_MODEL || 'meta-llama/llama-4-scout-17b-16e-instruct' }}
      STAGE2_BATCH_SIZE: ${{ vars.STAGE2_BATCH_SIZE || '4' }}
      STAGE2_MAX_ARTICLES: ${{ vars.STAGE2_MAX_ARTICLES || '0' }}
      STAGE2_REVIEW_REJECTED: ${{ vars.STAGE2_REVIEW_REJECTED || 'true' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect news
        run: node scripts/collect.mjs --date "${{ github.event.inputs.date || 'yesterday' }}" --include-body --body-concurrency 6

      - name: Analyze department briefs
        run: node scripts/analyze.mjs --date "${{ github.event.inputs.date || 'yesterday' }}"

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: collect news data"
          git push
