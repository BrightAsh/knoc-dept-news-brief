name: Daily news collect

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD, today, or yesterday"
        required: false
        default: "yesterday"
  schedule:
    # 00:05 Asia/Seoul every day. GitHub cron uses UTC.
    - cron: "5 15 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect news
        run: node scripts/collect.mjs --date "${{ github.event.inputs.date || 'yesterday' }}"

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: collect news data"
          git push
